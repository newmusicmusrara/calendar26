<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת שעות סמסטר ב׳ תשפ״ו | מוסררה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #0f1117;
    --surface:     #1a1d27;
    --surface2:    #22263a;
    --border:      #2e3347;
    --text:        #e8eaf0;
    --muted:       #6b7280;
    --accent:      #c084fc;

    /* Course colors */
    --c1:  #4ade80; /* מבוא למקאם / אנסמבל מקאם */
    --c2:  #60a5fa; /* אולפן דיגיטלי / אולפן */
    --c3:  #f472b6; /* מבוא להקשבה */
    --c4:  #fb923c; /* תורת המוזיקה */
    --c5:  #a78bfa; /* אנסמבל מודרני ★ */
    --c6:  #34d399; /* קומפוזיציה */
    --c7:  #fbbf24; /* מוזיקה ומהפכה */
    --c8:  #f87171; /* אקוסטיקה מעשית */
    --c9:  #38bdf8; /* כתיבת שירים */
    --c10: #e879f9; /* סינטזה */
    --c11: #86efac; /* תרגול תאוריה */
    --c12: #7dd3fc; /* מקהלה ★ */
    --c13: #4ade80; /* אנסמבל מקאם ★ */
    --c14: #d946ef; /* מועדון הקצב */
    --c15: #fb923c; /* הרמוניה */
    --c16: #f472b6; /* יצירתיות בחשמל */
    --c17: #c084fc; /* טקטס ודימוי */
    --c18: #fbbf24; /* מוסיקה ומהפכה ב׳ */
    --c19: #38bdf8; /* אולפן מתקדם */
    --c20: #a3e635; /* Max/MSP */
    --c21: #fb923c; /* מעבדה אנלוגית */
    --c22: #e879f9; /* דברים מופיעים */
    --c23: #4ade80; /* תזמור ועיבוד חדיש */
    --c24: #60a5fa; /* קידום עצמי */
    --c25: #fbbf24; /* אקוסטיקה */

    --cancel:  #374151;
    --pesach:  #1e293b;
    --holiday: #3b1c1c;
    --fest:    #1c2340;
    --quest:   #2d2510;

    --radius: 10px;
    --font: 'Heebo', sans-serif;
    --mono: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px 0;
    position: sticky; top: 0; z-index: 100;
    box-sizing: border-box;
    width: 100%;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
    overflow: hidden;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.1em;
    opacity: 0.8;
  }
  header h1 {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }

  /* ── Year tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    padding: 10px 28px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--surface2);
  }

  /* ── Main layout ── */
  main { padding: 28px 24px 60px; max-width: 1400px; margin: 0 auto; }

  /* ── Month block ── */
  .month-block { margin-bottom: 40px; }
  .month-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: var(--mono);
    margin-bottom: 10px;
    padding-right: 4px;
  }

  /* ── Calendar grid ── */
  .cal-grid {
    display: grid;
    grid-template-columns: 80px repeat(4, 1fr);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* Day header row */
  .day-hdr {
    background: var(--surface2);
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .day-hdr.day-name { color: var(--text); font-size: 13px; }
  .week-hdr-cell {
    background: var(--surface2);
    padding: 10px 8px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
  }

  /* Week row */
  .week-date { font-size:10px; color:#6b7280; margin-bottom:4px; }
  .week-label {
    font-size: 9px;
    color: #6b7280;
    padding: 4px 2px;
    line-height: 1.3;
    padding: 14px 8px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    text-align: center;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16px;
  }

  .day-cell {
    padding: 12px 10px;
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    min-height: 130px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    transition: background 0.15s;
  }
  .day-cell:hover { background: var(--surface2); }

  .date-num {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* ── Course pill ── */
  .course {
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    gap: 1px;
    transition: transform 0.1s, opacity 0.1s;
    cursor: default;
  }
  .course:hover { transform: translateY(-1px); opacity: 0.95; }
  .course-time {
    font-size: 9px;
    font-family: var(--mono);
    opacity: 0.7;
    letter-spacing: 0.05em;
  }
  .course-name { font-weight: 700; font-size: 11px; }
  .course-teacher { font-size: 9px; opacity: 0.75; }
  .course.ensemble .course-name::before { content: "★ "; }

  /* Special day states */
  .day-cell.is-cancel {
    background: var(--cancel);
    opacity: 0.6;
    pointer-events: none;
  }
  .day-cell.is-cancel_event {
    background: var(--cancel);
  }
  .is-cancel_event .special-label { color: #9ca3af; background: #1f2937; }
  .day-cell.is-pesach {
    background: var(--pesach);
    opacity: 0.7;
    pointer-events: none;
  }
  .day-cell.is-holiday {
    background: var(--holiday);
  }
  .day-cell.is-festival {
    background: var(--fest);
    border: 1px solid #4a6fa5;
  }
  .day-cell.is-question {
    background: var(--quest);
  }

  .special-label {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 8px;
    border-radius: 6px;
    text-align: center;
    margin-top: 8px;
  }
  .is-cancel .special-label { color: #9ca3af; background: #1f2937; }
  .is-pesach .special-label { color: #6b7280; background: #111827; }
  .is-holiday .special-label { color: #fca5a5; background: #450a0a; }
  .is-festival .special-label { color: #fde68a; background: #1e3a5f; }
  .is-question .special-label { color: #fcd34d; background: #1c1a05; font-size: 10px; }
  .question-icon { font-size: 10px; color: #fcd34d; margin-bottom: 4px; }

  /* ── Legend ── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding: 16px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* Year panel */
  .year-panel { display: none; }
  .year-panel.active { display: block; }

  /* Cal grid last row no bottom border */
  .cal-grid > *:nth-last-child(-n+5) {
    border-bottom: none;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .cal-grid { grid-template-columns: 50px repeat(4, 1fr); }
    .course-teacher { display: none; }
    main { padding: 16px 8px 40px; }
    .course-name { font-size: 10px; }
    .course-block { padding: 4px 5px; }
    .date-num { font-size: 10px; }
    .day-hdr { font-size: 11px; padding: 6px 4px; }
    .special-label { font-size: 10px; }
    .event-badge { font-size: 8px; padding: 1px 4px; }
  }

  @media (max-width: 480px) {
    html, body { overflow-x: hidden; width: 100%; }
    header { padding: 12px 12px 0; width: 100%; box-sizing: border-box; }
    main { padding: 12px 12px 40px; box-sizing: border-box; width: 100%; }
    .header-top { flex-direction: column; align-items: flex-start; gap: 8px; }
    header h1 { font-size: 18px; }
    .logo { font-size: 11px; }
    .radio-player { width: 100%; box-sizing: border-box; padding: 4px 8px; }
    .radio-label { min-width: 0; flex: 1; font-size: 10px; max-width: none; }
    .tabs { gap: 4px; flex-wrap: wrap; }
    .tab { font-size: 12px; padding: 6px 10px; }
    .legend { font-size: 10px; }
    .month-title { font-size: 13px; }
    .cal-section { width: 100%; box-sizing: border-box; }
    .cal-grid { width: 100%; box-sizing: border-box; grid-template-columns: 40px repeat(4, 1fr); }
    .course-name { font-size: 9px; line-height: 1.2; }
    .course-time { font-size: 8px; }
    .course-block { padding: 3px 4px; margin: 1px 0; border-radius: 3px; }
    .date-num { font-size: 9px; margin-bottom: 2px; }
    .day-hdr { font-size: 10px; padding: 5px 2px; letter-spacing: 0; }
    .special-label { font-size: 9px; }
  }

  /* ── Radio Player ── */
  .radio-player {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 6px 14px;
    position: relative;
  }
  .radio-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    min-width: 130px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
  .radio-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .radio-dot.live {
    background: #f87171;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .play-btn, .skip-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .skip-btn {
    width: 38px; height: 38px;
    font-size: 20px;
    border-color: var(--accent);
    color: var(--accent);
  }
  .play-btn:hover, .skip-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .play-btn.playing {
    background: rgba(192,132,252,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }


  .skip-btn.shuffle-on {
    background: rgba(192,132,252,0.2);
    border-color: var(--accent);
    color: var(--accent);
  }


  .day-cell.is-event {
    background: #1a1f2e;
    border: 1px solid #e879f9;
  }
  .is-event .special-label {
    color: #f0abfc;
    background: rgba(232,121,249,0.15);
    border: 1px solid rgba(232,121,249,0.3);
  }
  .event-badge {
    display: inline-block;
    font-size: 9px;
    font-family: var(--mono);
    letter-spacing: 0.1em;
    color: #e879f9;
    text-transform: uppercase;
    margin-bottom: 2px;
  }


  .evening-banner {
    margin-top: auto;
    border-radius: 6px;
    padding: 5px 8px;
    background: rgba(232,121,249,0.12);
    border: 1px solid rgba(232,121,249,0.35);
    font-size: 10px;
    color: #f0abfc;
    font-family: var(--mono);
    letter-spacing: 0.03em;
  }
  .evening-banner::before { content: "🌙 "; }

</style>
</head>

<header>

      <div class="radio-label">
        <img src="https://static.wixstatic.com/media/4eb42d_30d05fd8b345403a9a69707c21dbb29d~mv2.png/v1/fill/w_78,h_130,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/noun-radio-tower-1504713.png" style="height:24px;width:auto;opacity:0.8;margin-left:6px" />

      <button class="skip-btn" id="shuffleBtn" onclick="toggleShuffle()" title="shuffle">⇄</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showYear(1,this)">שנה א׳</button>
    <button class="tab" onclick="showYear(2,this)">שנה ב׳</button>
    <button class="tab" onclick="showYear(3,this)">שנה ג׳</button>

</header>

<main>

  <div id="year2" class="year-panel"></div>

</main>

const SPECIAL = {};
function addRange(from, to, type, label) {
  function parseDate(s) {
    const parts = s.split('-');
    return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  }
  let d = parseDate(from);
  const end = parseDate(to);
  while(d <= end) {
    const k = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    SPECIAL[k] = { type, label };
    d.setDate(d.getDate()+1);
  }
}

// ── Helpers ─────────────────────────────────────────────────────────
function getMondays(year, month) {
  // Returns all Mondays in the given month that fall in Mar-Jun 2026
  // We need Mon Mar 2 through Mon Jun 29
  const start = new Date(2026, 4, 4); // May 4 (Monday)
  const end   = new Date(2026, 6, 13); // July 13 (week containing Jul 16)
  const mondays = [];
  let d = new Date(start);
  while(d <= end) {
    if(d.getMonth()+1 === month) mondays.push(new Date(d));
    d.setDate(d.getDate()+7);
  }
  return mondays;
}

function allMondays() {
  const start = new Date(2026, 4, 4);
  const end   = new Date(2026, 6, 20);
  const list  = [];
  let d = new Date(start);
  while(d <= end) { list.push(new Date(d)); d.setDate(d.getDate()+7); }
  return list;
}

function dayKey(d) { return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function fmt(d) { return `${d.getDate()}/${d.getMonth()+1}`; }

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

    // Each week belongs to its Monday's month only
    const filtered = allMondays().filter(mon => mon.getMonth()+1 === month);


    if(!filtered.length) return;

                sinteza:       [3, new Date(2026,5,25)],
                targ_machshev: [1, new Date(2026,5,22)],
                ens_mod:       [1, new Date(2026,5,16)],
                comp_kiki:     [1, new Date(2026,5,16)],
                teoria_a:      [2, new Date(2026,5,23)],
                targ_teoria_a: [3, new Date(2026,5,18)],
                olpan_a:       [3, new Date(2026,5,25)],
                muz_mahap_a:   [3, new Date(2026,5,24)],
                akustika:      [3, new Date(2026,5,24)],
                shirim:        [3, new Date(2026,6,1)],
                // Y2+Y4
                mudon_kzev:    [0, new Date(2026,5,29)],
                mahala:        [1, new Date(2026,5,8)],
                ens_makam:     [0, new Date(2026,5,1)],
                maabada:       [2, new Date(2026,5,17)],
                maabada_dig:   [0, new Date(2026,4,18)],
                maabada_dig:   [0, new Date(2026,4,18)],
                olpan_dig_adv: [0, new Date(2026,5,8)],
                olpan_dig_adv_long: [0, new Date(2026,5,8)],
                harmonia:      [2, new Date(2026,5,16)],
                comp_or:       [2, new Date(2026,5,16)],
                targ_teoria_b: [3, new Date(2026,5,18)],
                muz_mahap_b:   [3, new Date(2026,5,25)],
                olpan_adv:     [3, new Date(2026,5,25)],
                ens_electro:   [2, new Date(2026,5,24)],
                max_msp:       [2, new Date(2026,4,27)],  // שיעור אחרון 27/5
                ytzir_hashmal: [3, new Date(2026,5,24)],
                taxt_dimuy:    [3, new Date(2026,5,24)],
                // Y3
                tizmor:        [2, new Date(2026,5,16)],
                dvarim:        [2, new Date(2026,4,13)],
                kiddum:        [3, new Date(2026,5,18)],
                olpan_g_personal: [3, new Date(2026,5,25)],
                olpan_g:       [3, new Date(2026,5,25)],
              };
              if(cutoffs[id] && day > cutoffs[id][1]) return;
              const c = COURSES[id];
              html += courseHTML(time, c, 1);
            });
          }
          html += `<div class="evening-banner">${sp.label}</div>`;
        } else if(sp && sp.type === 'event') {
          html += `<span class="event-badge">אירוע מחלקה</span>`;
          html += `<div class="special-label">🎶 ${sp.label}</div>`;
        } else if(sp && sp.type === 'pesach') {
          html += `<div class="special-label">✕ ${sp.label}</div>`;
          const dcPesach = DATE_COURSES[dcKey];
          if(dcPesach && Array.isArray(dcPesach)) {
            dcPesach.forEach(([time, id]) => {
              const c = COURSES[id];
              html += courseHTML(time, c, 1);
            });
          }
        } else if(sp && sp.type !== 'question') {
          const icon = sp.type==='festival' ? '🎵' : sp.type==='genaral' ? '★' : sp.type==='holiday' ? '🕯' : '✕';
          html += `<div class="special-label">${icon} ${sp.label}</div>`;
        } else if(sp && sp.type==='question') {
          html += `<div class="question-icon">⚠ ${sp.label}</div>`;
          slots.forEach(([time, id]) => {
            const c = COURSES[id];
            html += courseHTML(time, c, 0.55);
          });
        } else {
          const ensIds2 = ['mahala','ens_makam'];
          const ensCutoff = new Date(2026,5,8);
          const wdCutoff = WD_CUTOFFS[wd];
          if(wdCutoff && day > wdCutoff) {
            // past 12 sessions or July - no courses
          } else {
            const fromDC = dcVal !== undefined;
            slots.forEach(([time, id]) => {
              if(fromDC) { const c = COURSES[id]; if(c) html += courseHTML(time, c, 1); return; }
              if(ensIds2.includes(id) && day > ensCutoff) return;
              if(id==='hakshavet' && day < new Date(2026,3,13)) return;
              if(id==='planetarium' && wd !== 3) return;
              if(id==='targ_machshev' && day > new Date(2026,5,16)) return;
              // Per-course cutoffs
              const cutoffs = {
                // Y1
                makam_intro:   [1, new Date(2026,5,22)],
                hakshavet:     [1, new Date(2026,5,22)],
                olpan_dig:     [0, new Date(2026,5,22)],
                sinteza:       [3, new Date(2026,5,25)],
                targ_machshev: [1, new Date(2026,5,22)],
                ens_mod:       [1, new Date(2026,5,16)],
                comp_kiki:     [1, new Date(2026,5,16)],
                teoria_a:      [2, new Date(2026,5,23)],
                targ_teoria_a: [3, new Date(2026,5,18)],
                olpan_a:       [3, new Date(2026,5,25)],
                muz_mahap_a:   [3, new Date(2026,5,24)],
                akustika:      [3, new Date(2026,5,24)],
                shirim:        [3, new Date(2026,6,1)],
                // Y2+Y4
                mudon_kzev:    [0, new Date(2026,5,29)],
                mahala:        [1, new Date(2026,5,8)],
                ens_makam:     [0, new Date(2026,5,1)],
                maabada:       [2, new Date(2026,5,17)],
                maabada_dig:   [0, new Date(2026,4,18)],
                maabada_dig:   [0, new Date(2026,4,18)],
                olpan_dig_adv: [0, new Date(2026,5,8)],
                olpan_dig_adv_long: [0, new Date(2026,5,8)],
                harmonia:      [2, new Date(2026,5,16)],
                comp_or:       [2, new Date(2026,5,16)],
                targ_teoria_b: [3, new Date(2026,5,18)],
                muz_mahap_b:   [3, new Date(2026,5,25)],
                olpan_adv:     [3, new Date(2026,5,25)],
                ens_electro:   [2, new Date(2026,5,24)],
                max_msp:       [2, new Date(2026,4,27)],  // שיעור אחרון 27/5
                ytzir_hashmal: [3, new Date(2026,5,24)],
                taxt_dimuy:    [3, new Date(2026,5,24)],
                // Y3
                tizmor:        [2, new Date(2026,5,16)],
                dvarim:        [2, new Date(2026,4,13)],
                kiddum:        [3, new Date(2026,5,18)],
                olpan_g_personal: [3, new Date(2026,5,25)],
                olpan_g:       [3, new Date(2026,5,25)],
              };
              if(cutoffs[id] && day > cutoffs[id][1]) return;
              const c = COURSES[id];
              html += courseHTML(time, c, 1);
            });
          }
        }

        grid.innerHTML += `<div class="${cls}">${html}</div>`;
      }
    });

    block.appendChild(grid);

    el.appendChild(block);
  });
}

function courseHTML(time, c, opacity) {
  const bg  = hexToRgba(c.c, 0.12 * opacity);
  const brd = hexToRgba(c.c, 0.35 * opacity);
  const txt = opacity < 1 ? `rgba(255,255,255,${0.4})` : c.c;
  const ecls = c.e ? ' ensemble' : '';
  return `<div class="course${ecls}" style="background:${bg};border:1px solid ${brd}">
    <span class="course-time">${time}</span>
    <span class="course-name" style="color:${txt}">${c.n}</span>
    ${c.t ? `<span class="course-teacher">${c.t}</span>` : ''}
  </div>`;
}

// ── Tab switching ─────────────────────────────────────────────────────
function showYear(n, btn) {
  document.querySelectorAll('.year-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`year${n}`).classList.add('active');
  btn.classList.add('active');
}

// ── Init ──────────────────────────────────────────────────────────────
[1,2,3,4].forEach(renderYear);
</script>

<script>
(function() {
  let widget, isPlaying = false, ready = false;

  function setStatus(txt) {
    document.getElementById('radioStatus').textContent = txt;
  }
  function setPlaying(v) {
    isPlaying = v;
    const btn = document.getElementById('playBtn');
    const dot = document.getElementById('radioDot');
    btn.textContent = v ? '⏸' : '▶';
    v ? btn.classList.add('playing') : btn.classList.remove('playing');
    v ? dot.classList.add('live')    : dot.classList.remove('live');
  }

  function updateTitle() {
    widget.getCurrentSound(function(sound) {
      if (sound && sound.title) {
        const t = sound.title;
        setStatus(t.length > 24 ? t.slice(0,24)+'…' : t);
      }
    });
  }

  function initPlayer() {
    const iframe = document.getElementById('scWidget');
    widget = SC.Widget(iframe);

    widget.bind(SC.Widget.Events.READY, function() {
      ready = true;
      // Skip to a random position in the playlist
      widget.getSounds(function(sounds) {
        if (sounds && sounds.length > 0) {
          const idx = Math.floor(Math.random() * sounds.length);
          widget.skip(idx);
        }
        widget.play();
      });
    });

    widget.bind(SC.Widget.Events.PLAY, function() {
      setPlaying(true);
      updateTitle();
    });

    widget.bind(SC.Widget.Events.PAUSE, function() {
      setPlaying(false);
    });

    widget.bind(SC.Widget.Events.FINISH, function() {
      if (shuffleOn) { window.skipTrack(); } else { widget.next(); }
    });
  }

  let shuffleOn = false;

  window.togglePlay = function() {
    if (!ready) return;
    isPlaying ? widget.pause() : widget.play();
  };

  window.toggleShuffle = function() {
    shuffleOn = !shuffleOn;
    const btn = document.getElementById('shuffleBtn');
    if (shuffleOn) {
      btn.classList.add('shuffle-on');
      btn.title = 'shuffle פעיל';
      // jump to random track immediately
      widget.getSounds(function(sounds) {
        if (sounds && sounds.length > 0) {
          const idx = Math.floor(Math.random() * sounds.length);
          widget.skip(idx);
          setTimeout(function() { widget.play(); }, 200);
        }
      });
    } else {
      btn.classList.remove('shuffle-on');
      btn.title = 'shuffle כבוי';
    }
  };

  window.skipTrack = function() {
    if (!ready) return;
    widget.getSounds(function(sounds) {
      if (sounds && sounds.length > 0) {
        const idx = Math.floor(Math.random() * sounds.length);
        widget.skip(idx);
        setTimeout(function() { widget.play(); }, 200);
      }
    });
  };

  window.addEventListener('load', function() {
    const s = document.createElement('script');
    s.src = 'https://w.soundcloud.com/player/api.js';
    s.onload = initPlayer;
    s.onerror = function() { setStatus('Radio Musrara'); };
    document.head.appendChild(s);
  });
})();
</script>
